<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跨境电商退款分析 AI+BI 原型</title>
  <style>
    :root {
      --bg: #f4f0e8;
      --panel: rgba(255, 252, 247, 0.88);
      --panel-strong: #fffdf9;
      --line: rgba(107, 84, 54, 0.14);
      --text: #261d16;
      --muted: #73614f;
      --soft: #9c8a77;
      --brand: #ae5b2c;
      --brand-deep: #7c3d1b;
      --teal: #0f766e;
      --red: #b5412f;
      --amber: #d28728;
      --green: #237b4b;
      --shadow: 0 18px 40px rgba(62, 43, 20, 0.08);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(174, 91, 44, 0.14), transparent 28%),
        radial-gradient(circle at 85% 10%, rgba(15, 118, 110, 0.12), transparent 24%),
        linear-gradient(180deg, #fbf7f2 0%, #f2ece3 100%);
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      padding: 24px 18px;
      background: rgba(252, 249, 244, 0.88);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand {
      padding: 18px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #fffaf2, #f7efe5);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .brand-kicker {
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--brand);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.15;
      white-space: nowrap;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand p,
    .sidebar-note,
    .nav-hint,
    .meta-card p,
    .section-head p,
    .insight-main p,
    .action-card p,
    .sku-card p,
    .footer-note {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .sidebar-group {
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }

    .group-title {
      padding: 0 10px;
      font-size: 12px;
      color: var(--soft);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .nav-btn {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: 180ms ease;
      position: relative;
    }

    .nav-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-mark {
      width: 20px;
      height: 20px;
      color: var(--soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .nav-mark svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: linear-gradient(135deg, rgba(174, 91, 44, 0.1), rgba(15, 118, 110, 0.06));
      border-color: rgba(174, 91, 44, 0.12);
      box-shadow: 0 6px 16px rgba(90, 60, 25, 0.06);
    }

    .nav-btn.active::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 6px;
      bottom: 6px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--brand);
    }

    .nav-btn:hover .nav-mark,
    .nav-btn.active .nav-mark {
      color: var(--brand-deep);
    }

    .nav-btn strong {
      display: block;
      font-size: 14px;
      margin-bottom: 0;
      line-height: 1.2;
    }

    .sidebar-note {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
    }

    .content {
      padding: 26px;
      overflow: auto;
    }

    .toolbar,
    .meta-card,
    .card,
    .insight-card,
    .action-card,
    .sku-card {
      background: var(--panel);
      border: 1px solid rgba(107, 84, 54, 0.1);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .toolbar {
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .toolbar-main {
      min-width: 0;
    }

    .toolbar-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .toolbar-sub {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .toolbar-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(174, 91, 44, 0.1);
      color: var(--brand-deep);
      font-size: 12px;
      font-weight: 700;
    }

    .toolbar-pill.ghost {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .meta-card {
      padding: 16px;
      position: relative;
    }

    .meta-card strong {
      display: block;
      font-size: 13px;
      color: var(--soft);
      margin-bottom: 8px;
    }

    .meta-card .value {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .meta-card .delta.up { color: var(--red); }
    .meta-card .delta.down { color: var(--green); }

    .grid {
      display: grid;
      gap: 18px;
    }

    .kpi-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 18px;
      overflow: visible;
    }

    .two-col {
      grid-template-columns: 1.35fr 1fr;
      margin-bottom: 18px;
    }

    .equal-two-col {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 18px;
    }

    .card,
    .insight-card,
    .action-card,
    .sku-card {
      padding: 20px;
      overflow: visible;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
    }

    .section-head h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .section-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--brand-deep);
      background: rgba(174, 91, 44, 0.1);
      white-space: nowrap;
    }

    .kpi-value {
      font-size: 34px;
      font-weight: 800;
      margin: 12px 0 8px;
    }

    .subline {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .subline strong {
      color: var(--text);
    }

    .kpi-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .mini-btn,
    .text-link-btn,
    .tab-btn {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      color: var(--text);
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: 160ms ease;
    }

    .mini-btn {
      padding: 7px 12px;
      font-weight: 700;
    }

    .text-link-btn {
      padding: 6px 10px;
    }

    .mini-btn:hover,
    .text-link-btn:hover,
    .tab-btn:hover,
    .tab-btn.active {
      background: rgba(174, 91, 44, 0.1);
      border-color: rgba(174, 91, 44, 0.18);
      color: var(--brand-deep);
    }

    .popover-wrap {
      position: relative;
      display: inline-flex;
      z-index: 60;
    }

    .popover-card {
      position: absolute;
      left: 0;
      top: calc(100% + 10px);
      width: 340px;
      padding: 14px;
      border-radius: 16px;
      background: #fffdf9;
      border: 1px solid rgba(107, 84, 54, 0.12);
      box-shadow: 0 18px 36px rgba(62, 43, 20, 0.12);
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: 160ms ease;
      z-index: 30;
    }

    .popover-wrap:hover .popover-card,
    .popover-wrap:focus-within .popover-card {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .kpi-grid .card {
      position: relative;
      z-index: 1;
    }

    .kpi-grid .card:hover {
      z-index: 80;
    }

    .popover-card h4,
    .floating-panel h4 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .popover-item {
      display: grid;
      grid-template-columns: 1fr 72px;
      gap: 10px;
      padding: 9px 0;
      border-top: 1px solid rgba(107, 84, 54, 0.08);
      font-size: 12px;
    }

    .popover-item:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    .chart-wrap {
      height: 220px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(250, 245, 238, 0.94)),
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 47px,
          rgba(107, 84, 54, 0.08) 47px,
          rgba(107, 84, 54, 0.08) 48px
        );
      border: 1px solid rgba(107, 84, 54, 0.08);
      overflow: hidden;
      position: relative;
    }

    .chart-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .axis-label {
      fill: #8d7a67;
      font-size: 11px;
    }

    .axis-line {
      stroke: rgba(107, 84, 54, 0.18);
      stroke-width: 1;
    }

    .crosshair-line {
      stroke: rgba(174, 91, 44, 0.25);
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }

    .trend-point {
      cursor: pointer;
      transition: 160ms ease;
    }

    .trend-point:hover,
    .trend-point.active {
      r: 7;
      filter: drop-shadow(0 0 8px rgba(174, 91, 44, 0.22));
    }

    .trend-tooltip {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(107, 84, 54, 0.08);
      font-size: 12px;
      color: var(--muted);
    }

    .trend-tooltip strong {
      color: var(--text);
      font-size: 13px;
    }

    .trend-control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .legend {
      display: flex;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }

    .legend i {
      width: 11px;
      height: 11px;
      display: inline-block;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .insight-main {
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(174, 91, 44, 0.11), rgba(15, 118, 110, 0.08));
    }

    .insight-main h4,
    .reason-list h4,
    .dept-list h4,
    .action-list h4 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .status-chip.alert {
      background: rgba(181, 65, 47, 0.12);
      color: var(--red);
    }

    .status-chip.stable {
      background: rgba(35, 123, 75, 0.12);
      color: var(--green);
    }

    .reason-item,
    .dept-item,
    .task-row,
    .user-row,
    .quote,
    .dimension-row {
      display: grid;
      gap: 12px;
      align-items: center;
    }

    .reason-item,
    .dept-item,
    .task-row,
    .user-row,
    .dimension-row {
      padding: 12px 0;
      border-top: 1px solid rgba(107, 84, 54, 0.09);
    }

    .reason-item:first-child,
    .dept-item:first-child,
    .task-row:first-child,
    .user-row:first-child,
    .dimension-row:first-child {
      border-top: none;
      padding-top: 0;
    }

    .reason-item {
      grid-template-columns: 1.2fr 0.9fr 1.3fr;
      gap: 10px;
    }

    .reason-detail-wrap {
      padding: 8px 0 0;
      border-top: 1px dashed rgba(107, 84, 54, 0.08);
      margin-top: 8px;
    }

    .reason-subrow {
      display: grid;
      grid-template-columns: 120px 80px 1fr;
      gap: 10px;
      align-items: start;
      padding: 8px 0;
      font-size: 12px;
      color: var(--muted);
    }

    .reason-subrow strong {
      color: var(--text);
      font-size: 12px;
    }

    .tertiary-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tiny-chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(244, 240, 232, 0.92);
      border: 1px solid rgba(107, 84, 54, 0.08);
      font-size: 11px;
      color: var(--muted);
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: rgba(107, 84, 54, 0.08);
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), #e9a05d);
    }

    .dept-item {
      grid-template-columns: 110px 1fr;
    }

    .dept-tag {
      display: inline-flex;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(15, 118, 110, 0.1);
      color: var(--teal);
    }

    .dim-table,
    .task-table,
    .quote-list {
      display: grid;
      gap: 2px;
    }

    .dimension-row {
      grid-template-columns: 160px minmax(0, 1fr) 96px;
      gap: 14px;
    }

    .dimension-row .mini {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      word-break: break-word;
    }

    .dimension-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(174, 91, 44, 0.08);
      color: var(--brand-deep);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .score {
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .score.red { color: var(--red); }
    .score.green { color: var(--green); }
    .score.amber { color: var(--amber); }

    .action-layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }

    .action-topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .action-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(107, 84, 54, 0.1);
      background: rgba(255, 255, 255, 0.86);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: 160ms ease;
    }

    .action-chip.active,
    .action-chip:hover {
      background: rgba(174, 91, 44, 0.12);
      border-color: rgba(174, 91, 44, 0.18);
      color: var(--brand-deep);
    }

    .action-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .action-metric {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(107, 84, 54, 0.08);
    }

    .action-metric strong {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .action-metric .big {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
    }

    .strategy-card {
      padding: 14px 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(174, 91, 44, 0.1), rgba(15, 118, 110, 0.06));
      border: 1px solid rgba(107, 84, 54, 0.08);
      margin-bottom: 14px;
    }

    .strategy-card h4 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .strategy-list {
      display: grid;
      gap: 8px;
    }

    .strategy-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.78);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    .department-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .department-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(107, 84, 54, 0.1);
      background: rgba(255, 255, 255, 0.86);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 160ms ease;
    }

    .department-chip.active,
    .department-chip:hover {
      background: rgba(15, 118, 110, 0.1);
      border-color: rgba(15, 118, 110, 0.16);
      color: var(--teal);
    }

    .dispatch-board {
      display: grid;
      gap: 10px;
    }

    .task-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      align-items: start;
      padding: 12px 14px 11px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(107, 84, 54, 0.08);
      gap: 12px;
    }

    .task-row.active {
      background: rgba(174, 91, 44, 0.1);
      border-color: rgba(174, 91, 44, 0.16);
    }

    .task-main {
      min-width: 0;
      display: grid;
      gap: 9px;
    }

    .task-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      min-width: 0;
    }

    .task-col-label {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }

    .task-second-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(72px, 1fr));
      gap: 10px;
      align-items: start;
    }

    .task-cause {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.08);
      color: var(--teal);
      font-size: 11px;
      font-weight: 700;
    }

    .task-action {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      padding-left: 2px;
    }

    .task-title {
      display: block;
      padding-left: 2px;
      line-height: 1.38;
      font-size: 13px;
    }

    .task-tags {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-left: 2px;
    }

    .task-owner {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      line-height: 1.35;
      word-break: break-word;
    }

    .task-meta,
    .user-meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: rgba(107, 84, 54, 0.1);
      overflow: hidden;
      margin-top: 1px;
    }

    .task-side {
      min-width: 0;
    }

    .progress > span {
      display: block;
      height: 100%;

    function priorityClass(value) {
      if (value === "high") return "high";
      if (value === "mid") return "mid";
      return "low";
    }

    function priorityLabel(value) {
      if (value === "high") return "高优先";
      if (value === "mid") return "中优先";
      return "低优先";
    }

    function polylinePoints(values, height, width, padding) {
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = Math.max(max - min, 1);
      return values.map((value, index) => {
        const x = padding + (index * (width - padding * 2)) / (values.length - 1);
        const y = height - padding - ((value - min) / span) * (height - padding * 2);
        return `${x},${y}`;
      }).join(" ");
    }

    function pointCircles(values, color, width, height, padding) {
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = Math.max(max - min, 1);
      return values.map((value, index) => {
        const x = padding + (index * (width - padding * 2)) / (values.length - 1);
        const y = height - padding - ((value - min) / span) * (height - padding * 2);
        return `<circle cx="${x}" cy="${y}" r="4.5" fill="${color}" stroke="#fff6ef" stroke-width="2"></circle>`;
      }).join("");
    }

    function renderTrend(trend) {
      const trendData = buildTrendDataset(trend, appState.trendPeriod);
      const activeMetric = appState.trendMetric;
      const activeValues = activeMetric === "refundRate" ? trendData.refundRate : trendData.loss;
      const seriesLabel = activeMetric === "refundRate" ? "退款率趋势" : "退款损失指数";
      const seriesColor = activeMetric === "refundRate" ? "#ae5b2c" : "#0f766e";
      const width = 760;
      const height = 280;
      const padding = 34;
      const leftPad = 52;
      const bottomPad = 30;
      const metricMax = Math.max(...activeValues);
      const metricMin = Math.min(...activeValues);
      const seriesPoints = polylinePoints(activeValues, height, width, padding);
      const labels = trendData.days.map((day, index) => {
        const x = padding + (index * (width - padding * 2)) / (trendData.days.length - 1);
        return `<text x="${x}" y="${height - 8}" text-anchor="middle" class="axis-label">${day}天</text>`;
      }).join("");
      const yTicks = [0, 1, 2, 3].map(step => {
        const y = padding + step * ((height - bottomPad - padding) / 3);
        const tickValue = metricMax - ((metricMax - metricMin) * step / 3);
        return `
          <line x1="${leftPad - 6}" y1="${y}" x2="${width - padding}" y2="${y}" class="axis-line"></line>
          <text x="${leftPad - 10}" y="${y + 4}" text-anchor="end" class="axis-label">${activeMetric === "refundRate" ? tickValue.toFixed(1) + "%" : Math.round(tickValue)}</text>
        `;
      }).join("");

      return `
        <div class="chart-wrap">
          <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="近90天趋势图">
            <line x1="${leftPad}" y1="${padding}" x2="${leftPad}" y2="${height - bottomPad}" class="axis-line"></line>
            <line x1="${leftPad}" y1="${height - bottomPad}" x2="${width - padding}" y2="${height - bottomPad}" class="axis-line"></line>
            ${yTicks}
            <line id="trendCrosshair" x1="${leftPad}" y1="${padding}" x2="${leftPad}" y2="${height - bottomPad}" class="crosshair-line" style="opacity:0;"></line>
            <polyline points="${seriesPoints}" fill="none" stroke="${seriesColor}" stroke-width="3.5"></polyline>
            ${activeValues.map((value, index) => {
              const x = padding + (index * (width - padding * 2)) / (activeValues.length - 1);
              const y = height - padding - ((value - metricMin) / Math.max(metricMax - metricMin, 1)) * (height - padding * 2);
              const displayValue = activeMetric === "refundRate" ? `${value}%` : `${value}`;
              const note = activeMetric === "refundRate" ? `该时点退款率为 ${value}%` : `该时点退款损失指数为 ${value}`;
              return `<circle class="trend-point" cx="${x}" cy="${y}" r="4.5" fill="${seriesColor}" stroke="#fff6ef" stroke-width="2" data-x="${x}" data-day="${trendData.days[index]}天" data-series="${seriesLabel}" data-value="${displayValue}" data-note="${note}"></circle>`;
            }).join("")}
            ${labels}
            <text x="${20}" y="${18}" class="axis-label">${activeMetric === "refundRate" ? "退款率" : "损失指数"}</text>
          </svg>
        </div>
        <div class="trend-tooltip" id="trendTooltip">
          <strong>${trendData.days[trendData.days.length - 1]}天</strong>
          <div>悬浮在折线节点上，可查看当前指标在对应时点的值，并高亮时间轴位置。</div>
        </div>
        <div class="legend">
          <span><i style="background:${seriesColor}"></i>${seriesLabel}</span>
          <span>${appState.trendPeriod} 天周期</span>
        </div>
      `;
    }

    function buildTrendDataset(trend, period) {
      const waveRate = [0, -0.4, 0.5, -0.3, 0.6, -0.5, 0.4, -0.35, 0.45, -0.2, 0.3, -0.1];
      const waveLoss = [0, -14, 19, -11, 22, -18, 14, -12, 17, -9, 12, -6];
      const applyWave = (arr, waves) => arr.map((value, index) => Number((value + waves[index]).toFixed(1)));
      if (period === "30") {
        return {
          days: ["07", "14", "21", "30"],
          refundRate: applyWave(trend.refundRate.slice(-4), waveRate),
          loss: applyWave(trend.loss.slice(-4), waveLoss)
        };
      }
      if (period === "60") {
        return {
          days: ["10", "20", "30", "40", "50", "60"],
          refundRate: applyWave(trend.refundRate.slice(-6), waveRate),
          loss: applyWave(trend.loss.slice(-6), waveLoss)
        };
      }
      if (period === "180") {
        const ratePrefix = [7.6, 7.9];
        const lossPrefix = [218, 232];
        return {
          days: ["15", "30", "45", "60", "75", "90", "105", "120", "135", "150", "165", "180"],
          refundRate: applyWave([...ratePrefix, ...trend.refundRate], waveRate),
          loss: applyWave([...lossPrefix, ...trend.loss], waveLoss)
        };
      }
      return {
        days: trend.days,
        refundRate: applyWave(trend.refundRate, waveRate),
        loss: applyWave(trend.loss, waveLoss)
      };
    }

      const uniqueReasons = [...new Set(reasons)];
      const activeReason = appState.actionReason || uniqueReasons[0] || "尺码问题";
      const strategyPack = actionStrategyTemplates[activeReason] || actionStrategyTemplates[normalizeReason(activeReason)] || actionStrategyTemplates["其他"];
      const departmentTemplates = representativeTasksForReason(activeReason);
      const activeDepartment = appState.actionDepartment || departmentTemplates[0].department;
      const seededTasks = departmentTemplates.flatMap(template => template.items.map((item, index) => ({
        name: item,
        owner: template.owner,
        department: template.department,
        reason: activeReason,
        priority: index === 0 ? "high" : index === 1 ? "mid" : "low",
        progress: template.department === "技术部门" ? [68, 52, 41, 35][index] || 38 : template.department === "页面部门" ? [84, 72, 58, 46][index] || 44 : [61, 55, 49, 43][index] || 40,
        eta: template.department === "技术部门" ? ["5 月 3 日", "5 月 5 日", "5 月 7 日", "5 月 8 日"][index] || "5 月 9 日" : template.department === "页面部门" ? ["4 月 29 日", "4 月 30 日", "5 月 2 日", "5 月 4 日"][index] || "5 月 5 日" : ["5 月 1 日", "5 月 2 日", "5 月 4 日", "5 月 6 日"][index] || "5 月 7 日"
      })));
      const scopedTasks = seededTasks.filter(task => task.department === activeDepartment);
      const avgProgress = Math.round(scopedTasks.reduce((sum, task) => sum + task.progress, 0) / Math.max(scopedTasks.length, 1));
      const highPriorityCount = scopedTasks.filter(task => task.priority === "high").length;
      const validationCount = actions.validations.length;
      return `
        <section class="action-card">
          <div class="section-head">
            <div>
              <h3>策略制定、行动派发与追踪</h3>
              <p>围绕退款原因生成治理策略，联动责任部门派发任务并追踪执行效果。</p>
            </div>
            <span class="badge">Action Loop</span>
          </div>
          <div class="action-topbar">
            ${uniqueReasons.map(reason => `
              <button class="action-chip ${reason === activeReason ? "active" : ""}" data-action-reason="${reason}">
                ${reason}
              </button>
            `).join("")}
          </div>
          <div class="action-summary">
            <div class="action-metric">
              <strong>当前原因</strong>
              <div class="big">${activeReason}</div>
            </div>
            <div class="action-metric">
              <strong>关联任务数</strong>
              <div class="big">${scopedTasks.length}</div>
            </div>
            <div class="action-metric">
              <strong>平均进度</strong>
              <div class="big">${avgProgress}%</div>
            </div>
            <div class="action-metric">
              <strong>高优先任务</strong>
              <div class="big">${highPriorityCount}</div>
            </div>
          </div>
          <div class="strategy-card">
            <h4>策略建议</h4>
            <div class="task-meta">${strategyPack.strategy}</div>
          </div>
          <div class="department-toolbar">
            ${departmentTemplates.map(item => `
              <button class="department-chip ${item.department === activeDepartment ? "active" : ""}" data-action-department="${item.department}">
                ${item.department}
              </button>
            `).join("")}
          </div>
          <div class="action-layout">
            <div class="dispatch-board">
              ${scopedTasks.map(task => `
                <div class="task-row active">
                  <div class="task-main">
                    <strong class="task-title">${task.name}</strong>
                    <div class="task-tags">
                      <div class="task-cause">${task.reason}</div>
                    </div>
                    <div class="task-action">可执行项：${task.name}</div>
                    <div class="progress"><span style="width:${task.progress}%"></span></div>
                  </div>
                  <div class="task-side">
                    <div class="task-second-row">
                    <div class="task-col">
                      <div class="task-col-label">优先级</div>
                      <div class="tag ${priorityClass(task.priority)}">${priorityLabel(task.priority)}</div>
                    </div>
                    <div class="task-col">
                      <div class="task-col-label">部门</div>
                      <div class="task-owner">${task.department}</div>
                    </div>
                    <div class="task-col">
                      <div class="task-col-label">责任人</div>
                      <div class="task-owner">${task.owner}</div>
                    </div>
                    <div class="task-col">
                      <div class="task-col-label">状态</div>
                      <div class="task-meta" style="text-align:center;">${statusLabelByProgress(task.progress)}<br>${task.eta}</div>
                    </div>
                  </div>
                  </div>
                </div>
              `).join("")}
            </div>
            <div class="quote-list">
              <div class="validation-card">
                <strong>验证进展</strong>
                <p>当前原因下已配置 ${validationCount} 个验证节点，系统会在动作完成后对退款率、评论标签占比和损失金额做前后对比。</p>
              </div>
              ${actions.validations.map(item => `
                <div class="validation-card">
                  <strong>${item.title}</strong>
                  <p>${item.body}</p>
                </div>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderEvidence(actions) {
      const quotes = actions.quotes || [];
      if (!quotes.length) return "";
      const reasons = ["全部", ...new Set(quotes.map(item => item.tag))];
      const activeReason = appState.quoteReason || "全部";
      const filteredQuotes = activeReason === "全部" ? quotes : quotes.filter(item => item.tag === activeReason);
      return `
        <section class="card" style="margin-top:18px;">
          <div class="section-head" style="margin-bottom:12px;">
            <div>
              <h3>评论证据摘录</h3>
              <p>按退款原因筛选评论证据，快速查看 AI 归因背后的用户原声与图片样本。</p>
            </div>
            <span class="badge">Review Evidence</span>
          </div>
          <div class="action-topbar" style="margin-bottom:12px;">
            ${reasons.map(reason => `
              <button class="action-chip ${reason === activeReason ? "active" : ""}" data-quote-reason="${reason}">
                ${reason}
              </button>
            `).join("")}
          </div>
          <div class="evidence-list">
            ${filteredQuotes.map(item => `
              <div class="evidence-card">
                <div class="evidence-main">
                  <div class="evidence-head">
                    <div class="evidence-user">
                      <div class="evidence-avatar">${item.user.slice(0, 1)}</div>
                      <div class="evidence-user-meta">
                        <div class="evidence-user-name">${item.user}</div>
                        <div class="evidence-user-sub">${item.market} · ${item.date}</div>
                      </div>
                    </div>
                    <div class="evidence-tag">${item.tag}</div>
                  </div>
                  <div class="evidence-text">${item.text}</div>
                </div>
                <div class="evidence-thumbs">
                  ${(item.photos || []).map(photo => `<div class="evidence-thumb" style="background-image:${photo};"></div>`).join("")}
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderHero(view) {
      return `
        <section class="toolbar">
          <div class="toolbar-main">
            <h2 class="toolbar-title">${view.eyebrow}</h2>
            <div class="toolbar-sub">
              <span class="toolbar-chip">时间范围：近 90 天</span>
              <span class="toolbar-chip">站点：美国站 / 欧洲站</span>
              <span class="toolbar-chip">地区口径：州级订单地址</span>
              <span class="toolbar-chip">口径：退款订单 + 评论语义标签</span>
              <span class="toolbar-chip">刷新时间：2026-04-26 10:30</span>
            </div>
          </div>
          <div class="toolbar-actions">
            <span class="toolbar-pill">AI 洞察已开启</span>
            <span class="toolbar-pill ghost">异常货号 ${view.actions.tasks.length} 项待跟进</span>
          </div>
        </section>
      `;
    }

    function renderSkuTop(view) {
      if (!view.actions.quotes) return "";
      return `
        <section class="sku-card" style="margin-bottom:18px;">
          <div class="sku-hero">
            <div class="sku-image"></div>
            <div>
              <div class="eyebrow">${view.eyebrow}</div>
              <h2 class="sku-title">RC6487 风险款单款画像</h2>
              <p>结合样例数据中的退款评论，可见该款在美国站出现“颜色不喜欢”“面料不喜欢”“太小”“与描述不符”等复合型问题，适合用作单款闭环演示样本。</p>
              <div class="chip-row">
                <span class="chip">市场：美国站</span>
                <span class="chip">核心标签：太小 / 颜色不喜欢 / 与描述不符</span>
                <span class="chip">治理方向：页面 + 尺码建议优先</span>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function bindDynamicInteractions() {
      document.querySelectorAll(".trend-point").forEach(point => {
        point.addEventListener("mouseenter", () => {
          document.querySelectorAll(".trend-point").forEach(item => {
            item.classList.remove("active");
            item.setAttribute("r", "4.5");
          });
          point.classList.add("active");
          point.setAttribute("r", "7");
          const tooltip = document.getElementById("trendTooltip");
          const crosshair = document.getElementById("trendCrosshair");
          if (tooltip) {
            tooltip.innerHTML = `<strong>${point.dataset.day}</strong><div>${point.dataset.series}：${point.dataset.value}</div><div>${point.dataset.note}</div>`;
          }
          if (crosshair) {
            crosshair.setAttribute("x1", point.dataset.x);
            crosshair.setAttribute("x2", point.dataset.x);
            crosshair.style.opacity = "1";
          }
        });
      });

      document.querySelectorAll(".insight-marker-btn").forEach(button => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".insight-marker-btn").forEach(item => item.classList.remove("active"));
          button.classList.add("active");
          const panel = document.getElementById("insightDetailPanel");
          if (panel) panel.textContent = button.dataset.detail;
        });
      });

      document.querySelectorAll(".reason-detail-btn").forEach(button => {
        button.addEventListener("click", () => {
          appState.expandedReason = appState.expandedReason === button.dataset.reason ? "" : button.dataset.reason;
          render(appState.viewKey);
          const panel = document.getElementById("reasonDetailPanel");
          const content = document.getElementById("reasonDetailContent");
          const map = reasonSamples[appState.viewKey] || {};
          const samples = map[button.dataset.reason] || [];
          if (!panel || !content) return;
          panel.hidden = false;
          content.innerHTML = samples.map(item => `<div class="sample-item">${item}</div>`).join("") || `<div class="sample-item">暂无样本评论</div>`;
        });
      });

      document.querySelectorAll("[data-dim-tab]").forEach(button => {
        button.addEventListener("click", () => {
          appState.dimTab = button.dataset.dimTab;
          render(appState.viewKey);
        });
      });

      document.querySelectorAll("[data-dim-group]").forEach(button => {
        button.addEventListener("click", () => {
          const config = dimensionConfigLibrary[appState.viewKey] || dimensionConfigLibrary.dashboard;
          const group = config.groups.find(item => item.key === button.dataset.dimGroup);
          appState.dimGroup = button.dataset.dimGroup;
          appState.dimSubtab = group ? group.subtabs[0].key : "";
          render(appState.viewKey);
        });
      });

      document.querySelectorAll("[data-dim-subtab]").forEach(button => {
        button.addEventListener("click", () => {
          appState.dimSubtab = button.dataset.dimSubtab;
          render(appState.viewKey);
        });
      });

      document.querySelectorAll("[data-trend-metric]").forEach(button => {
        button.addEventListener("click", () => {
          appState.trendMetric = button.dataset.trendMetric;
          render(appState.viewKey);
        });
      });

      document.querySelectorAll("[data-trend-period]").forEach(button => {
        button.addEventListener("click", () => {
          appState.trendPeriod = button.dataset.trendPeriod;
          render(appState.viewKey);
        });
      });

      document.querySelectorAll("[data-heatmap-dim]").forEach(button => {
        button.addEventListener("click", () => {
          appState.heatmapDim = button.dataset.heatmapDim;
          render(appState.viewKey);
        });
      });

      document.querySelectorAll(".heat-cell").forEach(cell => {
        cell.addEventListener("mouseenter", () => {
          document.querySelectorAll(".heat-cell").forEach(item => item.classList.remove("active"));
          cell.classList.add("active");
          const note = document.getElementById("heatmapNote");
          if (note) note.textContent = `${cell.dataset.heatLabel} 的退款率相对更高，建议优先结合评论语义和动作进度进一步排查。`;
        });
      });

      document.querySelectorAll("[data-action-reason]").forEach(button => {
        button.addEventListener("click", () => {
          appState.actionReason = button.dataset.actionReason;
          appState.actionDepartment = "";
          render(appState.viewKey);
        });
      });

      document.querySelectorAll("[data-action-department]").forEach(button => {
        button.addEventListener("click", () => {
          appState.actionDepartment = button.dataset.actionDepartment;
          render(appState.viewKey);
        });
      });

      document.querySelectorAll("[data-quote-reason]").forEach(button => {
        button.addEventListener("click", () => {
          appState.quoteReason = button.dataset.quoteReason;
          render(appState.viewKey);
        });
      });
    }

    function render(viewKey) {
      appState.viewKey = viewKey;
      const view = pageData[viewKey];
      const dimConfig = dimensionConfigLibrary[viewKey] || dimensionConfigLibrary.dashboard;
      if (!appState.dimGroup) appState.dimGroup = dimConfig.defaultGroup;
      const group = dimConfig.groups.find(item => item.key === appState.dimGroup) || dimConfig.groups[0];
      if (!appState.dimSubtab || !group.subtabs.find(tab => tab.key === appState.dimSubtab)) {
        appState.dimSubtab = group.subtabs[0].key;
      }
      const app = document.getElementById("app");

      app.innerHTML = `
        ${renderHero(view)}
        ${viewKey === "sku" ? renderSkuTop(view) : ""}
        ${renderKpis(viewKey, view.kpis)}
        <div class="grid two-col" style="margin-bottom:18px;">
          <section class="card">
            <div class="section-head">
              <div>
                <h3>近 90 天指标趋势</h3>
                <p>支持指标切换、时间周期切换与节点 hover 高亮。</p>
              </div>
              <div class="section-tools">
                <span class="badge">Trend Chart</span>
              </div>
            </div>
            <div class="trend-control-row">
              <div class="control-group">
                <span class="control-label">核心指标</span>
                <button class="tab-btn ${appState.trendMetric === "refundRate" ? "active" : ""}" data-trend-metric="refundRate">退款率</button>
                <button class="tab-btn ${appState.trendMetric === "loss" ? "active" : ""}" data-trend-metric="loss">损失指标</button>
              </div>
              <div class="control-group">
                <span class="control-label">时间周期</span>
                <button class="tab-btn ${appState.trendPeriod === "30" ? "active" : ""}" data-trend-period="30">30天</button>
                <button class="tab-btn ${appState.trendPeriod === "60" ? "active" : ""}" data-trend-period="60">60天</button>
                <button class="tab-btn ${appState.trendPeriod === "90" ? "active" : ""}" data-trend-period="90">90天</button>
                <button class="tab-btn ${appState.trendPeriod === "180" ? "active" : ""}" data-trend-period="180">180天</button>
              </div>
            </div>
            ${renderTrend(view.trend)}
          </section>
          ${renderInsight(view.insight)}
        </div>
        <div style="margin-top:18px; margin-bottom:18px;">
          ${renderDimensions(view.dimensions, viewKey)}
        </div>
        <div class="grid equal-two-col">
          ${renderReasonBreakdown(view.insight)}
          ${renderSemanticAnalysis(viewKey)}
        </div>
        ${renderHeatmap(viewKey)}
        ${renderActions(view.actions, view.insight.departments, view.insight, viewKey === "sku")}
        ${renderEvidence(view.actions)}
        <section class="card" style="margin-top:18px;">
          <div class="section-head">
            <div>
              <h3>建议补充指标</h3>
              <p>参考退款场景指标体系，可继续纳入经营判断。</p>
            </div>
            <span class="badge">BI Extension</span>
          </div>
          <div class="grid equal-two-col" style="margin-bottom:0;">
            <div class="quote-list">
              <div class="quote">
                <strong>逆向物流成本占比</strong>
                <p>衡量退货对利润的侵蚀程度，帮助决定是否触发退款不退货策略。</p>
              </div>
              <div class="quote">
                <strong>SKU 风险分值</strong>
                <p>结合销量、退款率与毛利损失，快速定位“高销量、高退款、高损失”的红区货号。</p>
              </div>
            </div>
            <div class="quote-list">
              <div class="quote">
                <strong>二次销售率</strong>
                <p>判断逆向履约链路的残值回收效率，支持仓储与品控优化。</p>
              </div>
              <div class="quote">
                <strong>高退货用户识别</strong>
                <p>按 90 天退款频次识别高风险用户，支持退货权益分层与客服策略优化。</p>
              </div>
            </div>
          </div>
        </section>
        <div class="footer-note">
          说明：本 POC 依据 /Users/edy/Documents/GuanData/data_sample 中的字段结构与文档《子不语退款场景延展闭环方案_20260423_副本.md》《补充退货指标体系.md》设计，并补充演示数据以体现完整业务闭环。
        </div>
      `;
      bindDynamicInteractions();
    }

    document.querySelectorAll(".nav-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        appState.dimGroup = "";
        appState.dimSubtab = "";
        appState.expandedReason = "";
        appState.heatmapDim = "";
        appState.actionReason = "";
        appState.actionDepartment = "";
        appState.quoteReason = "";
        render(button.dataset.view);
      });
    });

    render("dashboard");
  </script>
</body>
</html>
